<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SolREM - Pro Sleep Markets</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      body {
        background-color: #050505;
        color: #E4E4E7;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #27272A; border-radius: 4px; }

      .glass-card {
        background: #121212;
        border: 1px solid #27272A;
        background-image: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, transparent 100%);
      }

      .glass-panel {
        background: rgba(18, 18, 18, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid #27272A;
      }

      .glow-text { text-shadow: 0 0 10px rgba(204, 255, 0, 0.3); }
      .active-nav { background: linear-gradient(180deg, rgba(204,255,0,0.1) 0%, transparent 100%); border-top: 2px solid #CCFF00; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
